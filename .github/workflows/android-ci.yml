name: Android CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Test and assemble
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failure_summary=$(grep -E -A12 -B3 '(^e: |^FAILURE:|FAILED|There were failing tests|AssertionError|What went wrong:|Execution failed)' gradle-build.log | tail -60)
            if [ -z "$failure_summary" ]; then failure_summary=$(tail -40 gradle-build.log); fi
            tail_text=$(printf '%s' "$failure_summary" | tail -c 3000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$tail_text"
            exit "$status"
          fi

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-gradle-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-project-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
